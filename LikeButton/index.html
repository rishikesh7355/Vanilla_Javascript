<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- defer used to load the script in backgorund and runs it after
      the DOM is fully parsed-->
    <script src="script.js" defer></script>
    <div class="container">
        <div id="post" class="post">
            <p>Lorem ipequatur quos facere neque asperiores rerum aspernatur quo quibusdam magni.</p>
            <footer class="footer">
                <span id="likeButton">👍Like</span>
                <span id="likeCount">0</span>
                <span id="dislikeButton">👎 Dislike</span  >        
                <span id="dislikeCount">0</span>
            </footer>
        </div>
    </div>
</body>
</html>

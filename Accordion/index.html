<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="accordion">
            <div class="accordion-header">
                <h1>Learn Frontend Development</h1>
                <p class="accordion-body">
                   This is Frontend Tutorial.
                </p>
            </div>
        </div>
           <div class="accordion">
            <div class="accordion-header">
                <h1>Learn ReactJS</h1>
                <p class="accordion-body">
                   This is ReactJs library Tutorial.
                </p>
            </div>
        </div>
           <div class="accordion">
            <div class="accordion-header">
                <h1>Learn Fullstack Development</h1>
                <p class="accordion-body">
                   This is fullstack Tutorial.
                </p>
            </div>
        </div>
           <div class="accordion">
            <div class="accordion-header">
                <h1>Learn Java + Springboot</h1>
                <p class="accordion-body">
                   This is Java And SpringBoot Tutorial.
                </p>
            </div>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="clockContainer">
            <div class="clock">
                <div id="hour" class="handsh"></div>
                <div id="min" class="handsM"></div>
                <div id="second" class="handsS"></div>
            </div>
        </div>

    </div>
</body>
<script src="index.js"></script>
</html>

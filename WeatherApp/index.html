<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container">
        <div id="city">
            <input type="text" id="cityInput" class="input" placeholder="Enter city name">
            <button id="searchButton" class="btn" onclick="getLocation()">Search</button>
        </div>

        <div id="tempMax"></div>
        <div id="tempMin"></div>
        <div id="humidity"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>

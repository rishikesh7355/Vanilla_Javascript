<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container">
        <h1>Weather App 🌈</h1>
        <div id="city">
            <input type="text" id="cityInput" class="input" placeholder="Enter city name">
            <button id="searchButton" class="btn">Search</button>
        </div>
        <div class="data">
            <h2 id="cityName"></h2>
            <span id="temp"></span>
            <p id="details"></p>
            <p id="windSpeed"></p>
            <p id="humidity"></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
